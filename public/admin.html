<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes · Roteirista 40s</title>
<style>
  :root { --bg: #f6f4ef; --card: #fff; --ink: #17151a; --muted: #6b6672; --line: #e4e0d8; --accent: #ff3d6e; --chip: #f0ece4; --ok: #12a150; --bad: #d83a3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0e12; --card: #18161d; --ink: #f3f1f5; --muted: #9a94a3; --line: #2a2731; --chip: #221f28; --ok: #3ccf7c; --bad: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 24px; } h1 span { color: var(--accent); }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 16px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--chip); color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; font-weight: 700; }
  .resumo { display: flex; gap: 24px; flex-wrap: wrap; } .resumo b { font-size: 24px; display: block; }
  .cli { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  .cli:first-child { border-top: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .acoes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .barra { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 6px; max-width: 240px; }
  .barra i { display: block; height: 100%; background: var(--accent); }
  .off { opacity: .55; }
  .aviso { background: var(--chip); border-radius: 12px; padding: 12px; margin-top: 12px; font-family: ui-monospace, monospace; font-size: 14px; white-space: pre-wrap; }
  .erro { color: var(--bad); }
  @media (max-width: 560px) { .cli { grid-template-columns: 1fr; } .acoes { justify-content: flex-start; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Clientes · Roteirista <span>40s</span></h1>
    <div><a href="/">Abrir o app</a> · <a href="#" id="sair">Sair</a></div>
  </header>

  <section class="card resumo" id="resumo"></section>

  <form class="card" id="novo">
    <b>Novo cliente</b>
    <div class="grade" style="margin-top:10px">
      <div><label for="nome">Nome</label><input id="nome"></div>
      <div><label for="email">E-mail *</label><input id="email" type="email" required></div>
      <div><label for="senha">Senha (vazio = gerar)</label><input id="senha" minlength="8"></div>
      <div><label for="limite">Roteiros/mês (vazio = ilimitado)</label><input id="limite" type="number" min="0" value="30"></div>
      <div><button class="primary">Criar acesso</button></div>
    </div>
    <div id="credencial"></div>
    <p class="erro" id="erro"></p>
  </form>

  <section class="card"><b>Acessos</b><div id="lista"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(url, metodo = 'GET', corpo) {
  const r = await fetch(url, { method: metodo, headers: { 'content-type': 'application/json' }, body: corpo && JSON.stringify(corpo) });
  if (r.status === 401) location.href = '/login';
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro);
  return j;
}
function credencial(u) {
  const texto = `Acesso ao Roteirista 40s\nEndereço: ${location.origin}/login\nE-mail: ${u.email}\nSenha: ${u.senha}`;
  $('credencial').innerHTML = `<div class="aviso">${esc(texto)}</div><button type="button" id="copiar" style="margin-top:8px">📋 Copiar para enviar ao cliente</button>`;
  $('copiar').onclick = () => navigator.clipboard.writeText(texto);
}
async function carregar() {
  const us = await api('/api/admin/usuarios');
  const clientes = us.filter((u) => u.papel === 'cliente');
  $('resumo').innerHTML = `<div><b>${clientes.length}</b><span class="meta">clientes</span></div>
    <div><b>${clientes.filter((u) => u.ativo).length}</b><span class="meta">ativos</span></div>
    <div><b>${us.reduce((a, u) => a + u.uso_mes, 0)}</b><span class="meta">roteiros neste mês</span></div>`;
  $('lista').innerHTML = us.map((u) => {
    const lim = u.limite_mensal ?? '∞';
    const pct = u.limite_mensal ? Math.min(100, (u.uso_mes / u.limite_mensal) * 100) : 0;
    return `<div class="cli ${u.ativo ? '' : 'off'}"><div>
      <b>${esc(u.nome || u.email)}</b> ${u.papel === 'admin' ? '<span class="meta">(admin)</span>' : ''} ${u.ativo ? '' : '<span class="erro">bloqueado</span>'}
      <div class="meta">${esc(u.email)} · último acesso: ${u.ultimo_acesso ? new Date(u.ultimo_acesso).toLocaleString('pt-BR') : 'nunca'}</div>
      <div class="meta">${u.uso_mes} / ${lim} roteiros neste mês</div>
      ${u.limite_mensal ? `<div class="barra"><i style="width:${pct}%"></i></div>` : ''}
    </div><div class="acoes">
      <button data-a="limite" data-id="${u.id}">Limite</button>
      <button data-a="zerar" data-id="${u.id}">Zerar uso</button>
      <button data-a="senha" data-id="${u.id}" data-email="${esc(u.email)}">Nova senha</button>
      ${u.papel === 'admin' ? '' : `<button data-a="ativo" data-id="${u.id}" data-v="${!u.ativo}">${u.ativo ? 'Bloquear' : 'Liberar'}</button>`}
    </div></div>`;
  }).join('');
  $('lista').querySelectorAll('button').forEach((b) => b.onclick = () => acao(b.dataset));
}
async function acao({ a, id, v, email }) {
  try {
    if (a === 'limite') {
      const n = prompt('Roteiros por mês (vazio = ilimitado):');
      if (n === null) return;
      await api(`/api/admin/usuarios/${id}`, 'PATCH', { limite_mensal: n.trim() });
    }
    if (a === 'zerar' && confirm('Zerar o uso deste mês?')) await api(`/api/admin/usuarios/${id}`, 'PATCH', { zerar_uso: true });
    if (a === 'ativo') await api(`/api/admin/usuarios/${id}`, 'PATCH', { ativo: v === 'true' });
    if (a === 'senha' && confirm('Gerar uma nova senha? A atual deixa de funcionar.')) {
      const u = await api(`/api/admin/usuarios/${id}`, 'PATCH', { nova_senha: '' });
      credencial({ email, senha: u.senha });
      scrollTo({ top: 0, behavior: 'smooth' });
    }
    carregar();
  } catch (e) { alert(e.message); }
}
$('novo').onsubmit = async (e) => {
  e.preventDefault(); $('erro').textContent = '';
  try {
    const u = await api('/api/admin/usuarios', 'POST', { nome: $('nome').value, email: $('email').value, senha: $('senha').value, limite_mensal: $('limite').value });
    credencial(u);
    $('nome').value = $('email').value = $('senha').value = '';
    carregar();
  } catch (err) { $('erro').textContent = err.message; }
};
$('sair').onclick = async (e) => { e.preventDefault(); await api('/api/logout', 'POST', {}); location.href = '/login'; };
carregar();
</script>
</body>
</html>
