# AI Prompter na Hostinger com subdomínio e HTTPS, no mesmo padrão do n8n
# (Traefik da Hostinger: entrypoint "websecure" e certresolver "letsencrypt").
#
# Antes de implantar, troque:
#   roteiros.seudominio.com  -> o seu subdomínio (aparece 1 vez)
#   as senhas da linha USUARIOS

services:
  roteirista:
    image: node:22-alpine
    container_name: roteirista-40s
    restart: unless-stopped
    ports:
      - "8081:3000"
    mem_limit: 128m
    cpus: 0.5
    labels:
      - traefik.enable=true
      - traefik.http.routers.roteirista.rule=Host(`roteiros.seudominio.com`)
      - traefik.http.routers.roteirista.entrypoints=websecure
      - traefik.http.routers.roteirista.tls.certresolver=letsencrypt
      - traefik.http.services.roteirista.loadbalancer.server.port=3000
    environment:
      USUARIOS: "admin:TroqueEstaSenha123,cliente1:OutraSenha456"
      NODE_ENV: production
      DADOS: /home/node/dados
      # Conexão com o Instagram (opcional): veja "Conectar com o Instagram" no README
      INSTAGRAM_APP_ID: ""
      INSTAGRAM_APP_SECRET: ""
      # Aparecem na Política de Privacidade e na página de Exclusão de dados (exigidas pela Meta)
      RESPONSAVEL: ""
      CONTATO_EMAIL: ""
      # IAs gratuitas em revezamento (preencha as que tiver; vazias são ignoradas).
      # Quando uma bate no limite, passa na hora para a próxima. O modelo de cada uma é escolhido
      # sozinho (o servidor lista os modelos da conta). O motor próprio só roda se o usuário escolher.
      GEMINI_API_KEY: ""        # aistudio.google.com/apikey
      GROQ_API_KEY: ""          # console.groq.com/keys
      CEREBRAS_API_KEY: ""      # cloud.cerebras.ai
      OPENROUTER_API_KEY: ""    # openrouter.ai/keys
      MISTRAL_API_KEY: ""       # console.mistral.ai/api-keys
      GITHUB_MODELS_TOKEN: ""   # github.com/settings/tokens (permissão "Models")
      COOKIE_SEGURO: "1"
    user: node
    volumes:
      - roteirista_dados:/home/node   # histórico e resultados de cada usuário: sobrevivem a reinícios e reimplantações
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        RAW=https://raw.githubusercontent.com/wyterlin1-svg/Roteiro-Assistente-/refs/heads/claude/roteirista-40s
        mkdir -p /home/node/app/public && cd /home/node/app
        # Baixa a versão mais nova; se o GitHub estiver fora do ar, liga com a cópia salva no volume.
        for f in servidor.js app.js public/index.html public/login.html; do
          wget -qO "$$f.baixando" "$$RAW/$$f" && mv "$$f.baixando" "$$f" || echo "GitHub indisponível: usando a cópia salva de $$f"
        done
        exec node servidor.js
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  roteirista_dados:
